name: "fakebook"

x-dotnet-runtime: &dotnet-runtime
  ASPNETCORE_ENVIRONMENT: Production
  DOTNET_EnableDiagnostics: "0"

x-observability: &observability
  OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4317
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACE_SAMPLE_RATIO:-0.1}

x-postgres-base: &postgres-base
  DB_HOST: ${DB_HOST:?Set DB_HOST in .env}
  DB_PORT: ${DB_PORT:?Set DB_PORT in .env}
  DB_NAME: ${DB_NAME:?Set DB_NAME in .env}

services:
  fakebook-tailscale:
    image: tailscale/tailscale:v1.98.4
    container_name: fakebook-tailscale
    hostname: cutie-fakebook
    restart: on-failure
    ports:
      # Cloudflare Tunnel runs on this host, so published maintenance/edge ports
      # do not need to listen on a public host interface. The services remain
      # reachable through the Tailscale IP of this shared network namespace.
      - "127.0.0.1:6970:6970/tcp"
      - "127.0.0.1:9464:9464/tcp"
      - "127.0.0.1:13133:13133/tcp"
      - "127.0.0.1:7069:8080/tcp"
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TZ=Asia/Ho_Chi_Minh
    cap_add:
      - net_admin
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./fakebook-tailscaled:/var/lib/tailscale
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

  fakebook-postgres:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    depends_on:
      fakebook-tailscale:
        condition: service_started
    container_name: fakebook-postgres
    restart: unless-stopped
    network_mode: service:fakebook-tailscale
    command: ["postgres", "-c", "port=${DB_PORT}"]
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - ./fakebook-postgres:/var/lib/postgresql
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "${DB_PORT}", "-d", "${DB_NAME}", "-U", "${DB_USER}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  fakebook-otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    depends_on:
      fakebook-tailscale:
        condition: service_started
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    container_name: fakebook-otel-collector
    restart: unless-stopped
    network_mode: service:fakebook-tailscale
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

  fakebook-redis:
    image: redis/redis-stack-server:7.4.0-v8
    depends_on:
      fakebook-tailscale:
        condition: service_started
    container_name: fakebook-redis
    restart: unless-stopped
    network_mode: service:fakebook-tailscale
    environment:
      REDIS_ARGS: --appendonly yes
    volumes:
      - ./fakebook-redis:/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  fakebook-authentication:
    image: ghcr.io/fakebook-works/backend-authentication:main
    depends_on:
      fakebook-tailscale:
        condition: service_started
      fakebook-redis:
        condition: service_healthy
      fakebook-postgres:
        condition: service_healthy
    container_name: fakebook-authentication
    restart: unless-stopped
    network_mode: service:fakebook-tailscale
    environment:
      <<: [*dotnet-runtime, *postgres-base, *observability]
      ASPNETCORE_URLS: http://+:1001
      ConnectionStrings__DefaultConnection: Host=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};Username=${AUTH_DB_USER:?Set AUTH_DB_USER in .env};Password=${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env};Search Path=auth;Timeout=10;Command Timeout=30
      ConnectionStrings__SecurityRedis: 127.0.0.1:6379
      DatabaseMigrations__Enabled: "false"
      Jwt__Issuer: fakebook-auth
      Jwt__Audience: fakebook
      Jwt__PrivateKeyBase64: ${JWT_PRIVATE_KEY_BASE64:?Generate JWT_PRIVATE_KEY_BASE64 with scripts/initialize-secrets.ps1}
      Jwt__KeyId: ${JWT_KEY_ID:?Set JWT_KEY_ID in .env}
      Jwt__LegacySigningKey: ${JWT_LEGACY_SIGNING_KEY:-}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      Gateway__InternalSharedSecret: ${AUTH_GATEWAY_SECRET:?Set a dedicated AUTH_GATEWAY_SECRET in .env}
      Gateway__AuthenticationServiceSharedSecret: ${AUTHENTICATION_INTERNAL_SECRET:?Set AUTHENTICATION_INTERNAL_SECRET in .env}
      InternalAuth__RequireSignature: "true"
      InternalAuth__SendLegacySecret: "false"
      Payment__InternalSharedSecret: ${PAYMENT_AUTH_SECRET:?Set PAYMENT_AUTH_SECRET in .env (minimum 32 bytes)}
      Auth__RefreshTokenCookieSecure: "true"
      Auth__RefreshTokenCookieSameSite: Lax
      Auth__AbsoluteSessionDays: ${AUTH_ABSOLUTE_SESSION_DAYS:-90}
      Auth__PasswordHashWorkFactor: ${AUTH_BCRYPT_WORK_FACTOR:-11}
      Auth__PasswordHashMaxConcurrency: ${AUTH_BCRYPT_MAX_CONCURRENCY:-2}
      Auth__PasswordHashQueueLimit: ${AUTH_BCRYPT_QUEUE_LIMIT:-16}
      Auth__PasswordHashQueueTimeoutSeconds: ${AUTH_BCRYPT_QUEUE_TIMEOUT_SECONDS:-5}
      Smtp__Enabled: ${SMTP_ENABLED:-false}
      Smtp__Host: ${SMTP_HOST:-127.0.0.1}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      Smtp__Username: ${SMTP_USERNAME:-disabled}
      Smtp__Password: ${SMTP_PASSWORD:-disabled}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL:-no-reply@example.com}
      Smtp__FromName: ${SMTP_FROM_NAME:-Fakebook}
      Snowflake__WorkerId: 1
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:1001/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    pull_policy: always
    init: true

  fakebook-social-graph:
    image: ghcr.io/fakebook-works/backend-socialgraph:main
    depends_on:
      fakebook-tailscale:
        condition: service_started
      fakebook-redis:
        condition: service_healthy
      fakebook-postgres:
        condition: service_healthy
      fakebook-authentication:
        condition: service_healthy
      fakebook-search:
        condition: service_healthy
      fakebook-recommendation:
        condition: service_healthy
      fakebook-messaging:
        condition: service_healthy
      fakebook-notification:
        condition: service_healthy
    container_name: fakebook-social-graph
    restart: unless-stopped
    network_mode: service:fakebook-tailscale
    environment:
      <<: [*dotnet-runtime, *postgres-base, *observability]
      ASPNETCORE_URLS: http://+:1002
      ConnectionStrings__PostgreSQL: Host=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};Username=${SOCIALGRAPH_DB_USER:?Set SOCIALGRAPH_DB_USER in .env};Password=${SOCIALGRAPH_DB_PASSWORD:?Set SOCIALGRAPH_DB_PASSWORD in .env};Search Path=social_graph;Timeout=10;Command Timeout=30
      ConnectionStrings__Redis: 127.0.0.1:6379
      ConnectionStrings__SecurityRedis: 127.0.0.1:6379
      DatabaseMigrations__Enabled: "false"
      Gateway__InternalSharedSecret: ${SOCIALGRAPH_GATEWAY_SECRET:?Set a dedicated SOCIALGRAPH_GATEWAY_SECRET in .env}
      InternalServices__SocialGraph__SharedSecret: ${SOCIALGRAPH_INTERNAL_SECRET:?Set SOCIALGRAPH_INTERNAL_SECRET in .env}
      IntegrationOutbox__PayloadEncryptionKey: ${SOCIALGRAPH_OUTBOX_ENCRYPTION_KEY:?Set SOCIALGRAPH_OUTBOX_ENCRYPTION_KEY in .env}
      IntegrationOutbox__EnsureSchemaOnStartup: "false"
      IntegrationOutbox__PollMilliseconds: ${IntegrationOutbox__PollMilliseconds:-500}
      IntegrationOutbox__MaxIdlePollMilliseconds: ${IntegrationOutbox__MaxIdlePollMilliseconds:-2000}
      InternalServices__Authentication__BaseUrl: http://127.0.0.1:1001
      InternalServices__Authentication__SharedSecret: ${AUTHENTICATION_INTERNAL_SECRET:?Set AUTHENTICATION_INTERNAL_SECRET in .env}
      InternalServices__Search__BaseUrl: http://127.0.0.1:1004
      InternalServices__Search__SharedSecret: ${SEARCH_INTERNAL_SECRET:?Set SEARCH_INTERNAL_SECRET in .env}
      InternalServices__Recommendation__BaseUrl: http://127.0.0.1:1003
      InternalServices__Recommendation__SharedSecret: ${RECOMMENDATION_INTERNAL_SECRET:?Set RECOMMENDATION_INTERNAL_SECRET in .env}
      InternalServices__Messaging__BaseUrl: http://127.0.0.1:1006
      InternalServices__Messaging__SharedSecret: ${MESSENGER_INTERNAL_SECRET:?Set MESSENGER_INTERNAL_SECRET in .env}
      InternalServices__Notification__BaseUrl: http://127.0.0.1:1005
      InternalServices__Notification__SharedSecret: ${NOTIFICATION_INTERNAL_SECRET:?Set NOTIFICATION_INTERNAL_SECRET in .env}
      InternalServices__Upload__BaseUrl: http://127.0.0.1:4001
      InternalServices__Upload__SharedSecret: ${UPLOAD_INTERNAL_SECRET:?Set UPLOAD_INTERNAL_SECRET in .env}
      InternalServices__TimeoutSeconds: 10
      InternalServices__Recommendation__ContentTimeoutSeconds: ${RECOMMENDATION_CONTENT_TIMEOUT_SECONDS:-180}
      InternalAuth__RequireSignature: "true"
      InternalAuth__SendLegacySecret: "false"
      ExternalServices__AuthenticationServiceCreateUser: http://127.0.0.1:1001/internal/users
      ExternalServices__AuthenticationServiceDeleteUser: http://127.0.0.1:1001/internal/users
      ExternalServices__NotificationServiceCreateNotification: http://127.0.0.1:1005/internal/notifications
      StoryCleanup__IntervalMinutes: 15
      StoryCleanup__BatchSize: 100
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:1002/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    pull_policy: always
    init: true

  fakebook-recommendation:
    image: ghcr.io/fakebook-works/backend-recommendation:main
    depends_on:
      fakebook-tailscale:
        condition: service_started
      fakebook-redis:
        condition: service_healthy
      fakebook-postgres:
        condition: service_healthy
    container_name: fakebook-recommendation
    restart: unless-stopped
    network_mode: service:fakebook-tailscale
    environment:
      <<: [*postgres-base, *observability]
      DATABASE_URL: postgresql://${RECOMMENDATION_DB_USER:?Set RECOMMENDATION_DB_USER in .env}:${RECOMMENDATION_DB_PASSWORD:?Set RECOMMENDATION_DB_PASSWORD in .env}@${DB_HOST}:${DB_PORT}/${DB_NAME}?options=-csearch_path%3Drecommendation%2Cpublic
      RECOMMENDATION_DB_MIGRATIONS_ENABLED: "false"
      INTERNAL_SHARED_SECRET: ${RECOMMENDATION_GATEWAY_SECRET:?Set a dedicated RECOMMENDATION_GATEWAY_SECRET in .env}
      RECOMMENDATION_INTERNAL_SECRET: ${RECOMMENDATION_INTERNAL_SECRET:?Set RECOMMENDATION_INTERNAL_SECRET in .env}
      SOCIAL_GRAPH_SERVICE_SECRET: ${SOCIALGRAPH_INTERNAL_SECRET:?Set SOCIALGRAPH_INTERNAL_SECRET in .env}
      RECOMMENDATION_MEDIA_ALLOWED_HOSTS: 127.0.0.1,${MEDIA_HOST:?Set MEDIA_HOST to the trusted media hostname in .env}
      RECOMMENDATION_MEDIA_BASE_URL: http://127.0.0.1:4001
      RECOMMENDATION_MEDIA_REQUIRE_ALLOWLIST: "true"
      RECOMMENDATION_MEDIA_MAX_BYTES: 26214400
      RECOMMENDATION_VIDEO_MAX_BYTES: 524288000
      RECOMMENDATION_MAX_VIDEO_FRAMES: 24
      RECOMMENDATION_MAX_MEDIA_PIXELS: 40000000
      SOCIAL_GRAPH_BASE_URL: http://127.0.0.1:1002
      INTERNAL_AUTH_REQUIRE_SIGNATURE: "true"
      INTERNAL_AUTH_SEND_LEGACY_SECRET: "false"
      SECURITY_REDIS_URL: redis://127.0.0.1:6379/0
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:1003/health/ready', timeout=5).status == 200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
    pull_policy: always
    init: true

  fakebook-search:
    image: ghcr.io/fakebook-works/backend-search:main
    depends_on:
      fakebook-tailscale:
        condition: service_started
      fakebook-redis:
        condition: service_healthy
      fakebook-postgres:
        condition: service_healthy
    container_name: fakebook-search
    restart: unless-stopped
    network_mode: service:fakebook-tailscale
    environment:
      <<: [*dotnet-runtime, *postgres-base, *observability]
      ASPNETCORE_URLS: http://+:1004
      ConnectionStrings__DefaultConnection: Host=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};Username=${SEARCH_DB_USER:?Set SEARCH_DB_USER in .env};Password=${SEARCH_DB_PASSWORD:?Set SEARCH_DB_PASSWORD in .env};Search Path=search;Timeout=10;Command Timeout=30
      ConnectionStrings__SecurityRedis: 127.0.0.1:6379
      Database__ApplySchemaOnStartup: "false"
      InternalSearchService__Secret: ${SEARCH_INTERNAL_SECRET:?Set SEARCH_INTERNAL_SECRET in .env}
      Gateway__InternalSharedSecret: ${SEARCH_GATEWAY_SECRET:?Set a dedicated SEARCH_GATEWAY_SECRET in .env}
      InternalServices__Messaging__BaseUrl: http://127.0.0.1:1006
      InternalServices__Messaging__SharedSecret: ${MESSENGER_INTERNAL_SECRET:?Set MESSENGER_INTERNAL_SECRET in .env}
      InternalServices__Messaging__TimeoutSeconds: 3
      InternalServices__Messaging__CacheSeconds: 45
      InternalServices__SocialGraph__BaseUrl: http://127.0.0.1:1002
      InternalServices__SocialGraph__SharedSecret: ${SOCIALGRAPH_INTERNAL_SECRET:?Set SOCIALGRAPH_INTERNAL_SECRET in .env}
      InternalServices__SocialGraph__TimeoutSeconds: 3
      InternalServices__SocialGraph__CacheSeconds: 45
      InternalAuth__RequireSignature: "true"
      InternalAuth__SendLegacySecret: "false"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:1004/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    pull_policy: always
    init: true

  fakebook-notification:
    image: ghcr.io/fakebook-works/backend-notification:main
    depends_on:
      fakebook-tailscale:
        condition: service_started
      fakebook-redis:
        condition: service_healthy
      fakebook-postgres:
        condition: service_healthy
    container_name: fakebook-notification
    restart: unless-stopped
    network_mode: service:fakebook-tailscale
    environment:
      <<: [*dotnet-runtime, *postgres-base, *observability]
      ASPNETCORE_URLS: http://+:1005
      ConnectionStrings__NotificationDb: Host=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};Username=${NOTIFICATION_DB_USER:?Set NOTIFICATION_DB_USER in .env};Password=${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD in .env};Search Path=notification;Timeout=10;Command Timeout=30
      ConnectionStrings__SecurityRedis: 127.0.0.1:6379
      Database__ApplyMigrationsOnStartup: "false"
      InternalAuthentication__GatewaySecret: ${NOTIFICATION_GATEWAY_SECRET:?Set a dedicated NOTIFICATION_GATEWAY_SECRET in .env}
      InternalAuthentication__NotificationServiceSecret: ${NOTIFICATION_INTERNAL_SECRET:?Set NOTIFICATION_INTERNAL_SECRET in .env}
      InternalAuth__RequireSignature: "true"
      InternalAuth__SendLegacySecret: "false"
      Snowflake__NodeId: 5
      NotificationDelivery__PollMilliseconds: ${NotificationDelivery__PollMilliseconds:-250}
      NotificationDelivery__MaxIdlePollMilliseconds: ${NotificationDelivery__MaxIdlePollMilliseconds:-2000}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:1005/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    pull_policy: always
    init: true

  fakebook-messaging:
    image: ghcr.io/fakebook-works/backend-messaging:main
    depends_on:
      fakebook-tailscale:
        condition: service_started
      fakebook-redis:
        condition: service_healthy
      fakebook-postgres:
        condition: service_healthy
      fakebook-notification:
        condition: service_healthy
      fakebook-upload:
        condition: service_healthy
    container_name: fakebook-messaging
    restart: unless-stopped
    network_mode: service:fakebook-tailscale
    environment:
      <<: [*dotnet-runtime, *postgres-base, *observability]
      ASPNETCORE_URLS: http://+:1006
      ConnectionStrings__PostgreSQL: Host=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};Username=${MESSENGER_DB_USER:?Set MESSENGER_DB_USER in .env};Password=${MESSENGER_DB_PASSWORD:?Set MESSENGER_DB_PASSWORD in .env};Search Path=messenger;Timeout=10;Command Timeout=30
      ConnectionStrings__SecurityRedis: 127.0.0.1:6379
      DatabaseMigrations__Enabled: "false"
      Gateway__InternalSharedSecret: ${MESSENGER_GATEWAY_SECRET:?Set a dedicated MESSENGER_GATEWAY_SECRET in .env}
      InternalServices__MessengerSharedSecret: ${MESSENGER_INTERNAL_SECRET:?Set MESSENGER_INTERNAL_SECRET in .env}
      InternalServices__SocialGraph__BaseUrl: http://127.0.0.1:1002
      InternalServices__SocialGraph__SharedSecret: ${SOCIALGRAPH_INTERNAL_SECRET:?Set SOCIALGRAPH_INTERNAL_SECRET in .env}
      InternalServices__Upload__BaseUrl: http://127.0.0.1:4001
      InternalServices__Upload__SharedSecret: ${UPLOAD_INTERNAL_SECRET:?Set UPLOAD_INTERNAL_SECRET in .env}
      InternalAuth__RequireSignature: "true"
      InternalAuth__SendLegacySecret: "false"
      InternalServices__TimeoutSeconds: 3
      Messaging__AllowedAttachmentHosts__0: ${MEDIA_HOST:-127.0.0.1}
      Messaging__OutboxPollMilliseconds: ${Messaging__OutboxPollMilliseconds:-250}
      Messaging__OutboxMaxIdlePollMilliseconds: ${Messaging__OutboxMaxIdlePollMilliseconds:-2000}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:1006/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    pull_policy: always
    init: true

  fakebook-payment:
    image: ghcr.io/fakebook-works/backend-payment:main
    depends_on:
      fakebook-tailscale:
        condition: service_started
      fakebook-authentication:
        condition: service_healthy
      fakebook-postgres:
        condition: service_healthy
    container_name: fakebook-payment
    restart: unless-stopped
    network_mode: service:fakebook-tailscale
    environment:
      <<: [*dotnet-runtime, *postgres-base, *observability]
      ASPNETCORE_URLS: http://+:1007
      ConnectionStrings__PaymentDatabase: Host=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};Username=${PAYMENT_DB_USER:?Set PAYMENT_DB_USER in .env};Password=${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD in .env};Search Path=payment;Timeout=10;Command Timeout=30
      Database__ApplySchemaOnStartup: "false"
      Payment__PublicBaseUrl: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env}
      Payment__FrontendPublicUrl: ${PUBLIC_ORIGIN}
      Payment__PaymentsEnabled: ${PAYMENTS_ENABLED:-false}
      Payment__RegisterWebhookOnStartup: ${PAYOS_REGISTER_WEBHOOK_ON_STARTUP:-true}
      Payment__CheckoutTtlMinutes: 30
      Payment__WorkerId: 7
      PayOS__ClientId: ${PAYOS_CLIENT_ID:-disabled}
      PayOS__ApiKey: ${PAYOS_API_KEY:-disabled}
      PayOS__ChecksumKey: ${PAYOS_CHECKSUM_KEY:-disabled}
      Gateway__SharedSecret: ${PAYMENT_GATEWAY_SECRET:?Set a dedicated PAYMENT_GATEWAY_SECRET in .env}
      Authentication__Endpoint: http://127.0.0.1:1001/graphql
      Authentication__PaymentSecret: ${PAYMENT_AUTH_SECRET}
      SocialGraph__BaseUrl: http://127.0.0.1:1002
      SocialGraph__InternalSecret: ${SOCIALGRAPH_INTERNAL_SECRET:?Set SOCIALGRAPH_INTERNAL_SECRET in .env}
      InternalAuth__RequireSignature: "true"
      InternalAuth__SendLegacySecret: "false"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:1007/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    pull_policy: always
    init: true

  fakebook-gateway:
    image: ghcr.io/fakebook-works/api-gateway:main
    depends_on:
      fakebook-tailscale:
        condition: service_started
      fakebook-authentication:
        condition: service_healthy
      fakebook-social-graph:
        condition: service_healthy
      fakebook-recommendation:
        condition: service_healthy
      fakebook-search:
        condition: service_healthy
      fakebook-notification:
        condition: service_healthy
      fakebook-messaging:
        condition: service_healthy
      fakebook-payment:
        condition: service_healthy
    container_name: fakebook-gateway
    restart: unless-stopped
    network_mode: service:fakebook-tailscale
    environment:
      <<: [*dotnet-runtime, *observability]
      ASPNETCORE_URLS: http://+:2001
      Jwt__Issuer: fakebook-auth
      Jwt__Audience: fakebook
      Jwt__PublicKeyBase64: ${JWT_PUBLIC_KEY_BASE64:?Generate JWT_PUBLIC_KEY_BASE64 with scripts/initialize-secrets.ps1}
      Jwt__KeyId: ${JWT_KEY_ID:?Set JWT_KEY_ID in .env}
      Jwt__LegacySigningKey: ${JWT_LEGACY_SIGNING_KEY:-}
      Gateway__FusionArchivePath: gateway.far
      Gateway__InternalSharedSecret: ${GATEWAY_SHARED_SECRET:?Set GATEWAY_SHARED_SECRET in .env}
      Gateway__SubgraphSecrets__Authentication: ${AUTH_GATEWAY_SECRET:?Set a dedicated AUTH_GATEWAY_SECRET in .env}
      Gateway__SubgraphSecrets__SocialGraph: ${SOCIALGRAPH_GATEWAY_SECRET:?Set a dedicated SOCIALGRAPH_GATEWAY_SECRET in .env}
      Gateway__SubgraphSecrets__Recommendation: ${RECOMMENDATION_GATEWAY_SECRET:?Set a dedicated RECOMMENDATION_GATEWAY_SECRET in .env}
      Gateway__SubgraphSecrets__Search: ${SEARCH_GATEWAY_SECRET:?Set a dedicated SEARCH_GATEWAY_SECRET in .env}
      Gateway__SubgraphSecrets__Notification: ${NOTIFICATION_GATEWAY_SECRET:?Set a dedicated NOTIFICATION_GATEWAY_SECRET in .env}
      Gateway__SubgraphSecrets__Messaging: ${MESSENGER_GATEWAY_SECRET:?Set a dedicated MESSENGER_GATEWAY_SECRET in .env}
      Gateway__SubgraphSecrets__Payment: ${PAYMENT_GATEWAY_SECRET:?Set a dedicated PAYMENT_GATEWAY_SECRET in .env}
      Gateway__TrustedProxyNetworks__0: 127.0.0.0/8
      Gateway__TrustedProxyNetworks__1: ::1/128
      Gateway__TrustedProxyNetworks__2: 172.16.0.0/12
      Gateway__SessionCacheSeconds: 30
      Gateway__RefreshTokenCookieName: fb_refresh
      Gateway__AllowedOrigins__0: ${PUBLIC_ORIGIN}
      # Every application container shares this network namespace, so loopback is the
      # canonical default. Each endpoint can still be overridden from envfile.
      Subgraphs__Authentication__Url: ${GATEWAY_AUTHENTICATION_SUBGRAPH_URL:-http://127.0.0.1:1001/graphql}
      Subgraphs__SocialGraph__Url: ${GATEWAY_SOCIALGRAPH_SUBGRAPH_URL:-http://127.0.0.1:1002/graphql}
      Subgraphs__Recommendation__Url: ${GATEWAY_RECOMMENDATION_SUBGRAPH_URL:-http://127.0.0.1:1003/graphql}
      Subgraphs__Search__Url: ${GATEWAY_SEARCH_SUBGRAPH_URL:-http://127.0.0.1:1004/graphql}
      Subgraphs__Notification__Url: ${GATEWAY_NOTIFICATION_SUBGRAPH_URL:-http://127.0.0.1:1005/graphql}
      Subgraphs__Messaging__Url: ${GATEWAY_MESSAGING_SUBGRAPH_URL:-http://127.0.0.1:1006/graphql}
      Subgraphs__Payment__Url: ${GATEWAY_PAYMENT_SUBGRAPH_URL:-http://127.0.0.1:1007/graphql}
      Subgraphs__Payment__WebhookUrl: ${GATEWAY_PAYMENT_WEBHOOK_URL:-http://127.0.0.1:1007/internal/webhooks/payos}
      PaymentGateway__TimeoutSeconds: 10
      PaymentGateway__WebhookPermitLimit: 60
      PaymentGateway__WebhookWindowSeconds: 60
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2001/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    pull_policy: always
    init: true

  fakebook-upload:
    image: ghcr.io/fakebook-works/upload-server:main
    depends_on:
      fakebook-tailscale:
        condition: service_started
      fakebook-redis:
        condition: service_healthy
      fakebook-authentication:
        condition: service_healthy
    container_name: fakebook-upload
    restart: unless-stopped
    network_mode: service:fakebook-tailscale
    environment:
      <<: [*dotnet-runtime, *observability]
      ASPNETCORE_URLS: http://+:4001
      Jwt__Issuer: fakebook-auth
      Jwt__Audience: fakebook
      Jwt__PublicKeyBase64: ${JWT_PUBLIC_KEY_BASE64:?Generate JWT_PUBLIC_KEY_BASE64 with scripts/initialize-secrets.ps1}
      Jwt__KeyId: ${JWT_KEY_ID:?Set JWT_KEY_ID in .env}
      Jwt__LegacySigningKey: ${JWT_LEGACY_SIGNING_KEY:-}
      AuthService__Url: http://127.0.0.1:1001/graphql
      Cors__AllowedOrigins__0: ${PUBLIC_ORIGIN}
      UploadStorage__RootPath: /data/media
      UploadStorage__StagedUploadsEnabled: "true"
      UploadStorage__PendingLifetimeMinutes: 1440
      UploadStorage__CleanupIntervalMinutes: 10
      InternalApi__SharedSecret: ${UPLOAD_INTERNAL_SECRET:?Set UPLOAD_INTERNAL_SECRET in .env}
      ConnectionStrings__SecurityRedis: 127.0.0.1:6379
      InternalAuth__RequireSignature: "true"
      InternalAuth__SendLegacySecret: "false"
    volumes:
      - ./fakebook-media-data:/data/media
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4001/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    pull_policy: always
    init: true

  fakebook-frontend:
    image: ghcr.io/fakebook-works/frontend:main
    depends_on:
      fakebook-tailscale:
        condition: service_started
      fakebook-gateway:
        condition: service_healthy
      fakebook-upload:
        condition: service_healthy
    container_name: fakebook-frontend
    restart: unless-stopped
    network_mode: service:fakebook-tailscale
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    pull_policy: always

  fakebook-edge:
    image: nginx:1.27-alpine
    depends_on:
      fakebook-tailscale:
        condition: service_started
      fakebook-frontend:
        condition: service_healthy
      fakebook-gateway:
        condition: service_healthy
      fakebook-upload:
        condition: service_healthy
    container_name: fakebook-edge
    restart: unless-stopped
    network_mode: service:fakebook-tailscale
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    configs:
      - source: edge-nginx
        target: /etc/nginx/conf.d/default.conf

configs:
  edge-nginx:
    content: |
      # Traffic reaches this container through the operator-managed reverse proxy and
      # Docker port publisher, so $$remote_addr is normally the docker-proxy address. Without
      # real_ip every "per IP" zone below collapses into a single global bucket and
      # one client can rate-limit the entire deployment. Only loopback and private
      # Docker bridge ranges are trusted; arbitrary external client networks are not, so
      # a client cannot promote a forged X-Forwarded-For entry into $$remote_addr.
      set_real_ip_from 127.0.0.1;
      set_real_ip_from 172.16.0.0/12;
      set_real_ip_from 192.168.0.0/16;
      set_real_ip_from 10.0.0.0/8;
      real_ip_header X-Forwarded-For;
      real_ip_recursive on;

      limit_req_zone $$binary_remote_addr zone=fakebook_graphql_per_ip:10m rate=8r/s;
      limit_req_zone $$binary_remote_addr zone=fakebook_upload_per_ip:10m rate=4r/s;
      # Separate connection zones. /graphql holds long-lived SSE subscriptions open
      # for up to an hour, so it must not share a budget with short media requests.
      limit_conn_zone $$binary_remote_addr zone=fakebook_graphql_conn_per_ip:10m;
      limit_conn_zone $$binary_remote_addr zone=fakebook_upload_conn_per_ip:10m;

      server {
        # The frontend nginx already owns port 80 in the shared Tailscale
        # namespace. Edge listens separately and proxies static traffic to it.
        listen 8080;
        server_tokens off;
        client_max_body_size 2m;
        limit_req_status 429;
        limit_conn_status 429;

        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        proxy_http_version 1.1;
        proxy_set_header Host $$http_host;
        proxy_set_header X-Forwarded-Host $$http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;

        location /graphql {
          limit_req zone=fakebook_graphql_per_ip burst=40 nodelay;
          # Each open chat, the inbox, presence and notifications each hold one SSE
          # stream, and browsers cap concurrent connections per origin, so this has
          # to accommodate several tabs rather than a handful of requests.
          limit_conn fakebook_graphql_conn_per_ip 64;
          proxy_buffering off;
          proxy_cache off;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
          proxy_pass http://127.0.0.1:2001;
        }

        location /api/ {
          proxy_buffering off;
          proxy_pass http://127.0.0.1:2001;
        }

        location /media/ {
          client_max_body_size 502m;
          limit_req zone=fakebook_upload_per_ip burst=20 nodelay;
          limit_conn fakebook_upload_conn_per_ip 16;
          proxy_request_buffering off;
          proxy_pass http://127.0.0.1:4001;
        }

        location = /health/upload {
          proxy_pass http://127.0.0.1:4001/health;
        }

        location / {
          proxy_pass http://127.0.0.1:80;
        }
      }
